name: 🕵️ Masothue Cá Nhân Crawler (Continuous Loop)

on:
  # Kích hoạt thủ công lần đầu để mồi hệ thống
  workflow_dispatch:

jobs:
  crawl:
    name: "Cá Nhân Crawler #${{ matrix.instance }} (50m)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: masothue-canhan-crawler
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4] # Chạy song song 4 máy ảo

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── 2. Python Setup ─────────────────────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dependencies ─────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pymysql lxml
          # Không cài playwright vì tool cá nhân dùng bs4+requests cho nhẹ

      # ── 4. Run Crawler ──────────────────────────────────────────────
      - name: 🚀 Run Cá Nhân Crawler #${{ matrix.instance }}
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MAX_RUNTIME_SECONDS: "3000" # 50 phút chạy/lần
          REQUEST_DELAY_SECONDS: "7.0" # Giãn cách 7s chống Cloudflare block
          INSTANCE_ID: ${{ matrix.instance }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python masothuecanhan.py

      # ── 5. Auto Trigger Next Run (Dùng GH_PAT để nối tiếp vòng lặp) ──
      - name: 🔄 Trigger Next Action Execution
        # luôn chạy (luôn restart), ngay cả khi file masothuecanhan.py return code 0 (khi gặp 403)
        if: matrix.instance == 1 && always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🚀 Tự động kích hoạt đợt tiếp theo..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawler_canhan.yml/dispatches \
            -d '{"ref":"main"}' || true
